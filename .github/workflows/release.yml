name: Build and release APK

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests, lint and debug build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

  instrumentation:
    name: UI tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [33, 36]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest

  release:
    needs: [verify, instrumentation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          mkdir -p .signing
          echo "$KEYSTORE_BASE64" | base64 --decode > .signing/release.jks
          printf 'storeFile=.signing/release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
      - name: Build signed APK
        run: ./gradlew assembleRelease -PversionCode=${{ github.run_number }} -PversionName=0.1.${{ github.run_number }}
      - name: Verify package and prepare update manifest
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.${{ github.run_number }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs "$APK"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$APK")
          TAG="v$VERSION_NAME"
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/ekosystem-punkty.apk"
          jq -n --argjson versionCode "$VERSION_CODE" --arg versionName "$VERSION_NAME" --arg apkUrl "$URL" --argjson size "$SIZE" --arg sha256 "$SHA" --arg notes "Automatyczne wydanie z main: ${{ github.sha }}" '{versionCode:$versionCode,versionName:$versionName,apkUrl:$apkUrl,size:$size,sha256:$sha256,notes:$notes}' > update.json
          cp "$APK" ekosystem-punkty.apk
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: 0.1.${{ github.run_number }}
        run: gh release create "v$VERSION_NAME" ekosystem-punkty.apk update.json --title "Ekosystem Punkty $VERSION_NAME" --generate-notes
